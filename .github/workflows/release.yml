name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/release.yml@5af6f6d2d7039ff332b02aec2482107ac4381cdf # v0.6.170
    permissions:
      actions: read
      contents: write
    with:
      check-workflow: ci.yml
      artifacts: |
        clipboard-Linux-X64
        clipboard-macOS-ARM64
        clipboard-macOS-X64
        clipboard-Windows-X64
      release-metadata: |
        release-metadata-linux-x64.json
        release-metadata-macos-arm64.json
        release-metadata-macos-x64.json
        release-metadata-windows-x64.json
