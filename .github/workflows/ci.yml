name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    name: Source and GNOME
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      minimum-rust: ${{ steps.minimum.outputs.version }}
    steps:
      - name: Prepare source checks
        id: setup
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/prepare@dc8f083393ae11ba7b9d4acd36c56137a29ec9a8 # v0.6.175
        with:
          managed: false
          working-directory: daemon
          fetch-depth: 0
          rust-version: '1.100.0'
          rust-components: rustfmt
          python-version: '3.15.2'
          node-version: '26.13.1'
          tools: shellcheck@0.11.0
      - name: Prepare the full-history secret checker
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/release-assets@dc8f083393ae11ba7b9d4acd36c56137a29ec9a8 # v0.6.175
        with:
          managed: false
          manifest: scripts/ci-tools.json
          directory: ${{ runner.temp }}/clipboard-source-tools
          add-to-path: true
      - name: Check the source and GNOME contracts
        id: project
        run: |
          just setup-platform
          just check
          just test-extension
          just secrets
      - name: Read the declared minimum compiler
        id: minimum
        run: |
          version=$(just minimum-rust-version)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Complete source checks
        if: always()
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/complete@dc8f083393ae11ba7b9d4acd36c56137a29ec9a8 # v0.6.175
        with:
          status: ${{ job.status }}
          project-outcome: ${{ steps.project.outcome }}
          task: source and GNOME checks
          task-type: test
          name: source
          read-token: ${{ steps.setup.outputs.read-token }}

  native:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            uv: '0.13.8'
            tools: cargo-deny@0.21.0
          - os: macos-26
            uv: '0.13.8'
            tools: ''
          - os: macos-26-intel
            uv: '0.13.8'
            tools: ''
          - os: windows-2025
            uv: ''
            tools: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # The released recipe entry point lacks the standard Intel macOS label.
      # The documented prepare/complete frame keeps the same SDK/cache/lifecycle implementation.
      - name: Prepare the native job
        id: setup
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/prepare@dc8f083393ae11ba7b9d4acd36c56137a29ec9a8 # v0.6.175
        with:
          managed: false
          working-directory: daemon
          rust-version: '1.100.0'
          rust-components: rustfmt,clippy
          python-version: '3.15.2'
          uv-version: ${{ matrix.uv }}
          tools: ${{ matrix.tools }}
      - name: Qualify the current platform
        id: project
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          just setup
          just setup-platform
          if [ "$EVENT" = pull_request ]; then just test; else just verify-native; fi
      - name: Complete the native job
        if: always()
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/complete@dc8f083393ae11ba7b9d4acd36c56137a29ec9a8 # v0.6.175
        with:
          status: ${{ job.status }}
          project-outcome: ${{ steps.project.outcome }}
          task: native platform qualification
          task-type: build
          name: native-${{ runner.os }}-${{ runner.arch }}
          artifact: ${{ github.event_name != 'pull_request' && 'dist' || '' }}
          artifact-name: clipboard-${{ runner.os }}-${{ runner.arch }}
          artifact-days: 14
          diagnostics: build/ci/daemon.log
          read-token: ${{ steps.setup.outputs.read-token }}

  minimum:
    name: Minimum Rust version
    needs: source
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: ${{ needs.source.outputs.minimum-rust }}
    steps:
      - name: Prepare the declared minimum compiler
        id: setup
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/prepare@dc8f083393ae11ba7b9d4acd36c56137a29ec9a8 # v0.6.175
        with:
          managed: false
          working-directory: daemon
          rust-version: ${{ needs.source.outputs.minimum-rust }}
          python-version: '3.15.2'
      - name: Check the declared minimum compiler
        id: project
        run: |
          just setup-daemon
          just check-minimum-rust
      - name: Complete the minimum-compiler check
        if: always()
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/complete@dc8f083393ae11ba7b9d4acd36c56137a29ec9a8 # v0.6.175
        with:
          status: ${{ job.status }}
          project-outcome: ${{ steps.project.outcome }}
          task: declared minimum compiler
          task-type: test
          name: minimum-rust
          read-token: ${{ steps.setup.outputs.read-token }}

  merge-stops:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/merge-stops.yml@dc8f083393ae11ba7b9d4acd36c56137a29ec9a8 # v0.6.175
    permissions:
      contents: read
