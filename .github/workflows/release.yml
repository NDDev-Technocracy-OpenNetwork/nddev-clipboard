name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/release.yml@d7a4abb010a0cc85967fa09267b100fc90412981 # v0.6.64
    permissions:
      actions: read
      contents: write
    with:
      check-workflow: ci.yml
      artifacts: |
        clipboard-Linux-X64
        clipboard-macOS-ARM64
        clipboard-macOS-X64
        clipboard-Windows-X64
      release-metadata: |
        release-metadata-linux-x64.json
        release-metadata-macos-arm64.json
        release-metadata-macos-x64.json
        release-metadata-windows-x64.json
