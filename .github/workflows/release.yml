name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/release.yml@12e4fad876f0155284944ad53d73fbd03721a484 # v0.6.168
    permissions:
      actions: read
      contents: write
    with:
      check-workflow: ci.yml
      artifacts: |
        clipboard-Linux-X64
        clipboard-macOS-ARM64
        clipboard-macOS-X64
        clipboard-Windows-X64
      release-metadata: |
        release-metadata-linux-x64.json
        release-metadata-macos-arm64.json
        release-metadata-macos-x64.json
        release-metadata-windows-x64.json
